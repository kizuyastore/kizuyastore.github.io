.force-opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.reason-field{margin:4px 0 8px}
.reason-field textarea{min-height:64px}

/* ---------- Link otomatis Netlify ---------- */
.nf-panel .steps{margin-top:4px}
.nf-account{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r-in);background:color-mix(in srgb,#2f8a4a 10%,var(--surface));color:var(--ink);font-size:.92rem;flex-wrap:wrap}
.nf-account .icon{color:#2f8a4a}
.nf-account span{flex:1;min-width:0}
.nf-link{display:flex;flex-direction:column;gap:2px;margin:14px 0 12px;padding:14px;border:1.5px dashed color-mix(in srgb,var(--primary) 50%,var(--line));border-radius:var(--r-in);background:color-mix(in srgb,var(--primary) 5%,var(--surface))}
.nf-link small{color:var(--muted);font-size:.8rem}
.nf-link a{font-size:1.15rem;font-weight:800;color:var(--primary);text-decoration:none;word-break:break-all}
.nf-when{color:var(--muted);font-size:.82rem}
.nf-dirty{color:var(--accent)}
.nf-panel .hero-actions{margin-top:12px}
.nf-name{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:var(--r-in);background:var(--surface);overflow:hidden}
.nf-name input{border:0!important;box-shadow:none!important;min-width:0}
.nf-name span{padding:0 12px;color:var(--muted);font-weight:600;white-space:nowrap}
.nf-name:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
.nf-status{margin-top:12px;padding:10px 12px;border-radius:var(--r-in);background:var(--soft);font-size:.9rem;font-weight:600}
.nf-status.err{background:color-mix(in srgb,var(--danger) 10%,var(--surface));color:var(--danger);font-weight:500}
.btn-block.nf-go{margin-top:6px}
.manual-share summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
.manual-share summary::-webkit-details-marker{display:none}
.manual-share summary b{display:block;font-size:1rem}
.manual-share summary small{color:var(--muted);font-size:.84rem}
.manual-share summary .icon{transition:transform .2s;color:var(--muted)}
.manual-share[open] summary .icon{transform:rotate(180deg)}

.pill-ok{background:color-mix(in srgb,#2f8a4a 14%,var(--surface));color:#2f8a4a;margin:0}

.star-pick{display:flex;flex-wrap:wrap;gap:6px}
.star-pick label{cursor:pointer}
.star-pick input{position:absolute;opacity:0;width:1px;height:1px}
.star-pick span{display:inline-block;padding:.45rem .7rem;border:1.5px solid var(--line);border-radius:var(--r-btn);font-size:.85rem;color:#F5A524;font-weight:700;background:var(--surface)}
.star-pick label:last-child span,.star-pick label:first-child span{color:var(--ink)}
.star-pick input:checked+span{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,var(--surface))}
.star-pick input:focus-visible+span{outline:2.5px solid var(--accent);outline-offset:2px}
/* ---------- Penilaian ---------- */
.stars{display:inline-flex;gap:1px;color:color-mix(in srgb,var(--ink) 18%,transparent);font-size:1.05rem;line-height:1;letter-spacing:0}
.stars i{font-style:normal}
.stars i.on{color:#F5A524}
.stars.sm{font-size:.82rem}
.rv-sum{display:grid;grid-template-columns:auto 1fr;gap:20px 28px;align-items:center}
.rv-score{text-align:center}
.rv-score b{display:block;font-size:3rem;line-height:1;font-weight:800}
.rv-score b small{font-size:1.1rem;font-weight:600;color:var(--muted)}
.rv-score .stars{font-size:1.2rem;margin:8px 0 4px}
.rv-score span{display:block;color:var(--muted);font-size:.85rem}
.rv-bars{display:flex;flex-direction:column;gap:6px;min-width:0}
.rv-bar{display:grid;grid-template-columns:30px 1fr 30px;gap:10px;align-items:center;font-size:.85rem;color:var(--muted)}
.rv-bar i{display:block;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.rv-bar i u{display:block;height:100%;border-radius:99px;background:#F5A524;text-decoration:none}
.rv-bar span:last-child{text-align:right}
.rv-filter{margin:16px 0 0}
.rv-list{display:flex;flex-direction:column}
.rv-item{display:grid;grid-template-columns:40px 1fr;gap:4px 12px;padding:18px 0;border-bottom:1px solid var(--line)}
.rv-item:last-child{border-bottom:0}
.rv-av{width:40px;height:40px;border-radius:50%;background:color-mix(in srgb,var(--primary) 14%,var(--surface));color:var(--primary);display:grid;place-items:center;font-weight:800;font-size:.85rem;grid-row:span 2}
.rv-head{display:flex;flex-direction:column;gap:3px;min-width:0}
.rv-head b{font-size:.95rem}
.rv-meta{color:var(--muted);font-size:.8rem}
.rv-text{grid-column:2;margin:6px 0 0;white-space:pre-line;line-height:1.6}
.rv-empty{padding:28px 0;text-align:center;color:var(--muted)}
.rate-pick{display:flex;gap:6px}
.rate-star{font:inherit;font-size:2.1rem;line-height:1;background:none;border:0;padding:2px 4px;cursor:pointer;color:var(--line);transition:transform .12s,color .12s}
.rate-star.on{color:#F5A524}
.rate-star:active{transform:scale(1.15)}
.rate-star:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}

/* ---------- Domain sendiri ---------- */
.nf-domain{margin-top:14px;border:1.5px solid var(--line);border-radius:var(--r-in);padding:0 14px}
.nf-domain summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;cursor:pointer}
.nf-domain summary::-webkit-details-marker{display:none}
.nf-domain summary b{display:flex;align-items:center;gap:6px;font-size:.95rem}
.nf-domain summary b .icon{width:16px;height:16px;color:var(--primary)}
.nf-domain summary small{color:var(--muted);font-size:.82rem}
.nf-domain summary>.icon{transition:transform .2s;color:var(--muted)}
.nf-domain[open] summary>.icon{transform:rotate(180deg)}
.nf-domain[open]{padding-bottom:14px}
.nf-domain.on{padding:14px}
.nf-domain-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}
.nf-domain-head b{display:block}
.nf-domain-head small{color:var(--muted);font-size:.82rem}
.dns-table{display:grid;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px;font-size:.88rem}
.dns-table [role=row]{display:grid;grid-template-columns:70px 70px minmax(0,1fr);gap:8px;padding:9px 12px;align-items:center;border-top:1px solid var(--line)}
.dns-table .dns-h{border-top:0;background:var(--soft);font-weight:700;font-size:.78rem;color:var(--muted)}
.dns-table .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;display:flex;align-items:center;justify-content:space-between;gap:6px;word-break:break-all}
.dns-table .mono .btn{font-family:var(--font);flex-shrink:0}
@media (max-width:760px){.dns-table [role=row]{grid-template-columns:64px minmax(0,1fr)}.dns-table [role=row]>span:nth-child(3){grid-column:1/-1;background:var(--soft);border-radius:8px;padding:6px 6px 6px 10px}.dns-table .dns-h>span:nth-child(3){display:none}}
.host-list{margin:8px 0 0 18px;display:grid;gap:4px}

/* ---------- Pesanan online ---------- */
.done-sum{text-align:left;border:1px solid var(--line);border-radius:var(--r-in);padding:12px 14px;margin:4px 0 14px;display:grid;gap:6px;font-size:.92rem}
.done-sum div{display:flex;justify-content:space-between;gap:12px}
.done-sum .tot{border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.done-sum .tot b{font-size:1.05rem}
.pill-online{background:color-mix(in srgb,var(--primary) 14%,var(--surface));color:var(--primary);margin-left:6px}
.pull-help{display:block}
.pull-help summary{list-style:none;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.pull-help summary::-webkit-details-marker{display:none}
.pull-help .steps{margin:10px 0 6px 6px}

/* ---------- Perbaikan: sheet & dialog mentok ke bawah layar ---------- */
html,body{min-height:100%}
.overlay,.cs-layer,.scrim,.pview{top:0;left:0;right:0;bottom:0;width:100%;height:100vh;height:100dvh}
.admin.nav-open .scrim{width:100%;height:100vh;height:100dvh}
@media (max-width:760px){
  .overlay{align-items:flex-end;padding:0}
  .overlay .dialog,.overlay .dialog.wide,.overlay.sheet .dialog{
    margin:0;max-width:none;width:100%;
    max-height:92vh;max-height:92dvh;
    border-radius:22px 22px 0 0;
    padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));
    /* menambal celah di bawah sheet apa pun penyebabnya (bar navigasi, address bar) */
    box-shadow:0 -12px 34px -16px rgba(0,0,0,.4),0 120px 0 0 var(--surface)!important;
  }
  .overlay.sheet .dialog{height:auto}
  .cs-sheet{align-items:flex-end}
  .cs-sheet .cs-menu{margin:0;max-height:78vh;max-height:78dvh;box-shadow:0 120px 0 0 var(--surface)}
  .pv-bar{bottom:0}
  .pv-bar-in{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
}

function registerFonts(list){
  list = Array.isArray(list) ? list : [];
  Object.keys(FONTS).forEach(k => { if (FONTS[k].custom && !list.some(f => 'cf_' + f.id === k)) delete FONTS[k]; });
  let css = '';
  list.forEach(f => {
    if (!f || !/^[\w-]+$/.test(f.id || '') || !/^data:font\/|^data:application\//.test(f.data || '')) return;
    FONTS['cf_' + f.id] = {label:f.name || 'Font sendiri', note:'Font sendiri', css:`"KZF ${f.id}"`, custom:true};
    css += `@font-face{font-family:"KZF ${f.id}";src:url(${f.data});font-display:swap}\n`;
  });
  let st = document.getElementById('custom-fonts');
  if (!st) { st = document.createElement('style'); st.id = 'custom-fonts'; document.head.appendChild(st); }
  if (st.textContent !== css) st.textContent = css;
}
function applyTheme(){
  registerFonts(db.look.customFonts);

  r.setProperty('--fs', SIZES[L.textSize] || '16px');

  r.setProperty('--cols', cols); r.setProperty('--cols-md', Math.min(cols, 3)); r.setProperty('--cols-sm', +L.colsMobile || 2);
  r.colorScheme = dark ? 'dark' : 'light';

  const b = document.body.classList;

}

let revealObs = null;
function finishReveal(el){ el.classList.remove('reveal', 'in'); if (el.dataset.pid) state.seen.add(el.dataset.pid); }
function showReveal(el){ el.classList.add('in'); const d = parseInt(el.style.getPropertyValue('--d')) || 0; setTimeout(() => finishReveal(el), d + 1000); }
function setupReveal(root = document){
  const els = [...root.querySelectorAll('.reveal:not(.in)')];
  const off = db.look.anim === 'mati' || !('IntersectionObserver' in window) || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  if (off) { els.forEach(finishReveal); return; }
  if (!revealObs) revealObs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { revealObs.unobserve(e.target); showReveal(e.target); } }), {threshold:.1, rootMargin:'0px 0px -30px 0px'});
  els.forEach(el => revealObs.observe(el));
}

/* Foto: dikecilkan dulu supaya muat di penyimpanan browser */
function readImage(file, max = 900, keepAlpha = false){
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) return reject(new Error('bukan gambar'));
    const r = new FileReader();
    r.onerror = reject;
    r.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * s)); c.height = Math.max(1, Math.round(img.height * s));
        const g = c.getContext('2d');
        if (!keepAlpha) { g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); }
        g.drawImage(img, 0, 0, c.width, c.height);
        resolve(keepAlpha ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', .82));
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

  try {

      inp.value = '';

/* ---------- Keranjang ---------- */
function setQty(id, q){

  if (isSoon(p)) { delete cart[id]; saveCart(); toast(`${p.name} belum rilis. ${soonText(p)}.`); return; }
  const st = stockOf(p);
  if (q > st) { toast(`Stok ${p.name} tinggal ${st}.`); q = st; }

}

}
const sumLines = lines => lines.reduce((s, l) => s + priceOf(l.p) * l.qty, 0);

async function sendOrderOnline(o){          // pesanan dari link toko dikirim ke Netlify Forms, nanti diambil di menu Pesanan

    if (/^https?:$/.test(location.protocol)) {
      const body = new URLSearchParams({'form-name':'pesanan', 'bot-field':'', 'no-pesanan':o.id, nama:o.name, whatsapp:o.phone, email:o.email || '', total:rp(o.total),
        produk:o.items.map(i => `${i.qty}x ${i.name} (${rp(i.price * i.qty)})`).join('; '), catatan:o.note || '', data:JSON.stringify(o)});

      if (img) { const s = Math.max(th / img.width, th / img.height); g.drawImage(img, pad + (th - img.width * s) / 2, y + (th - img.height * s) / 2, img.width * s, img.height * s); }
      else { g.font = `88px ${emojiFam}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#000'; g.fillText(isImg(src) ? '🖼️' : (src || '📦'), pad + th / 2, y + th / 2 + 6); g.textAlign = 'left'; g.textBaseline = 'alphabetic'; }
      g.restore();
      const x = pad + th + 34, maxW = W - x - pad;

      g.fillStyle = t.muted; g.font = `400 32px ${fam}`; g.fillText(`${it.qty} x ${rp(it.price)}`, x, y + 112);
      g.fillStyle = t.ink; g.font = `800 36px ${fam}`; g.textAlign = 'right'; g.fillText(rp(it.price * it.qty), W - pad, y + 112); g.textAlign = 'left';
      y += rowH;

      g.textAlign = 'right'; g.fillText(rp(o.sub), W - pad, y); g.textAlign = 'left'; y += 52;
      g.fillText(fitText(g, `Promo ${o.promo.code} (-${o.promo.pct}%)`, W - pad * 2 - 260), pad, y);

function saveProduct(e, id){
  e.preventDefault();
  const f = new FormData(e.target), g = k => String(f.get(k) || '').trim();
  const promoOn = f.has('promoOn'), normal = Math.max(0, +g('price') || 0), promoPrice = Math.max(0, +g('promoPrice') || 0), pu = g('promoUntil'), pud = pu ? new Date(pu) : null;
  if (promoOn) {
    if (!g('promoPrice') || !(promoPrice < normal)) { toast('Harga promo harus lebih murah dari harga normal.'); return; }
    if (!pud || isNaN(pud)) { toast('Isi kapan promonya berakhir.'); return; }
    if (pud <= new Date() && !(id && getProduct(id) && getProduct(id).promoUntil === pud.toISOString())) { toast('Waktu berakhir promo harus nanti, bukan yang sudah lewat.'); return; }
  }
  let cat = g('cat');
  if (cat === '__new') { const nm = g('newcat'); if (!nm) { toast('Isi nama kategori barunya dulu.'); return; } cat = ensureCategory(nm); }
  const data = { name:g('name'), cat, price:Math.max(0, +g('price') || 0), was:Math.max(0, +g('was') || 0), stock:Math.max(0, parseInt(g('stock'), 10) || 0),
    img:g('img') || '📦', desc:g('desc'), detail:g('detail'), gallery:galEdit.slice(), show:f.has('show'), fav:f.has('fav'), soon:f.has('soon'), release:f.has('soon') ? g('release') : '',
    promoOn, promoPrice:promoOn ? promoPrice : (getProduct(id) || {}).promoPrice || 0, promoUntil:promoOn ? pud.toISOString() : '', promoLabel:g('promoLabel') };
  if (id) Object.assign(getProduct(id), data); else { db.products.unshift({id:'p' + uid(), ...data}); admin.q = ''; }
  save(); closeDialog(); renderAdmin(); toast(id ? 'Perubahan disimpan.' : `${data.name} ditambahkan.`);
}

function renameCategory(id, v){

async function deleteCategory(id){
  const c = db.categories.find(x => x.id === id); if (!c) return;
  const n = db.products.filter(p => p.cat === id).length;
  if (!await ask(`Hapus kategori “${c.name}”?`, n ? `${n} produk di dalamnya tidak ikut terhapus, hanya jadi tanpa kategori.` : 'Kategori ini belum punya produk.')) return;
  db.categories = db.categories.filter(x => x.id !== id);
  db.products.forEach(p => { if (p.cat === id) p.cat = ''; });

let pullBusy = false, pullAt = 0;
async function pullOrders(manual){
  const n = db.share.netlify; if (!n.token || !n.siteId || pullBusy) return;
  if (!manual && Date.now() - pullAt < 60000) return;
  pullBusy = true; pullAt = Date.now();
  const btn = $('#pullBtn'); if (btn) { btn.disabled = true; btn.lastChild.textContent = ' Mengambil…'; }
  try {
    const subs = await nfReq(`/sites/${n.siteId}/submissions?per_page=100`);
    let added = 0;
    (Array.isArray(subs) ? subs : []).forEach(sub => {
      if (!sub || (sub.form_name && sub.form_name !== 'pesanan')) return;
      if (root.orders.some(o => o.subId === sub.id)) return;
      let o; try { o = JSON.parse((sub.data || {}).data || '{}'); } catch (e) { return; }
      if (!o || !Array.isArray(o.items) || !o.items.length) return;
      const items = o.items.slice(0, 50).map(i => ({pid:String(i.pid || ''), name:String(i.name || '').slice(0, 120), price:Math.max(0, +i.price || 0), qty:Math.max(1, Math.min(999, parseInt(i.qty, 10) || 1))}));
      const sub2 = items.reduce((t, i) => t + i.price * i.qty, 0), disc = Math.max(0, Math.min(sub2, +o.disc || 0));
      let id = /^PS-[A-Z0-9-]{3,30}$/.test(String(o.id || '')) ? String(o.id) : 'PS-' + uid().toUpperCase().slice(0, 6);
      if (root.orders.some(x => x.id === id)) id += '-' + uid().toUpperCase().slice(0, 3);
      root.orders.unshift({id, subId:sub.id, online:true, date:sub.created_at || o.date || new Date().toISOString(), name:String(o.name || '').slice(0, 80), phone:String(o.phone || '').slice(0, 30), email:String(o.email || '').slice(0, 120),
        method:'digital', address:'', note:String(o.note || '').slice(0, 500), items, fee:0, sub:sub2, promo:o.promo && o.promo.code ? {code:String(o.promo.code).slice(0, 20), pct:+o.promo.pct || 0} : null, disc, total:sub2 - disc, status:'Baru'});
      if (tracked()) items.forEach(i => { const p = getProduct(i.pid); if (p) p.stock = Math.max(0, p.stock - i.qty); });
      added++;
    });
    if (added) { root.orders.sort((a, b) => Date.parse(b.date) - Date.parse(a.date)); save(); }
    if (admin.tab === 'pesanan' || admin.tab === 'ringkasan') renderAdmin();
    if (manual || added) toast(added ? `${added} pesanan baru dari toko online.` : 'Belum ada pesanan baru.');
  } catch (e) {
    if (manual) toast(e.status === 401 ? 'Kode akses Netlify kedaluwarsa. Hubungkan ulang di menu Link pembeli.' : 'Gagal mengambil pesanan. Cek internetmu lalu coba lagi.');
  } finally { pullBusy = false; const b2 = $('#pullBtn'); if (b2) { b2.disabled = false; b2.lastChild.textContent = ' Ambil pesanan online'; } }
}

function adjustStock(o, sign){
  if (!tracked()) return;
  o.items.forEach(i => { const p = (i.pid && getProduct(i.pid)) || db.products.find(x => x.name === i.name); if (p) p.stock = Math.max(0, p.stock + sign * i.qty); });

function setStatus(id, s){
  const o = db.orders.find(x => x.id === id); if (!o || o.status === s) return;
  if (o.stockTaken !== false) {

function moInput(e){
  const t = e.target;
  if (t.dataset.k) mo[t.dataset.k] = t.type === 'checkbox' ? t.checked : t.value;
  if (t.dataset.row) { const r = mo.items[+t.dataset.row]; r[t.dataset.f] = t.dataset.f === 'qty' ? Math.max(1, parseInt(t.value, 10) || 1) : t.value; }
  const el = $('#moTotal'); if (el) el.textContent = rp(moSum());
}
function saveManual(e){
  e.preventDefault();
  const merged = [];
  mo.items.forEach(r => { const p = getProduct(r.pid); if (!p) return; const m = merged.find(x => x.pid === p.id); m ? m.qty += r.qty : merged.push({pid:p.id, name:p.name, price:priceOf(p), qty:r.qty}); });
  if (!merged.length) { toast('Pilih minimal satu produk.'); return; }
  const o = {id:'PS-' + (root.seq++), date:new Date().toISOString(), name:mo.name.trim(), phone:mo.phone.trim(), email:mo.email.trim(), method:'digital',
    address:'', note:mo.note.trim(), items:merged, fee:0, total:merged.reduce((s, i) => s + i.price * i.qty, 0), status:mo.status,
    stockTaken:tracked() && !!mo.take && mo.status !== 'Batal'};
  if (o.stockTaken) adjustStock(o, -1);
  db.orders.unshift(o); save(); closeDialog(); admin.of = 'Semua'; renderAdmin(); toast(`Pesanan ${o.id} dicatat.`);
}

/* Unduh file (CSV & cadangan) */
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function exportCSV(){
  const rows = [['No. pesanan', 'Waktu', 'Pelanggan', 'WhatsApp', 'Email', 'Produk', 'Promo', 'Potongan', 'Total', 'Status', 'Catatan']];
  db.orders.forEach(o => rows.push([o.id, fmtDate(o.date), o.name, o.phone, o.email || '', o.items.map(i => `${i.qty}x ${i.name}`).join(', '), o.promo ? `${o.promo.code} (-${o.promo.pct}%)` : '', o.disc || 0, o.total, o.status, o.note]));
  const csv = '﻿' + rows.map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(';')).join('\r\n');
  download(`pesanan-${new Date().toISOString().slice(0, 10)}.csv`, csv, 'text/csv;charset=utf-8');
  toast('File CSV pesanan diunduh.');
}

function savePromo(e, id){
  e.preventDefault();
  const f = new FormData(e.target), code = String(f.get('code') || '').toUpperCase().replace(/[^A-Z0-9]/g, ''), pct = Math.round(+f.get('pct'));
  if (code.length < 3) { toast('Kode minimal 3 karakter.'); return; }
  if (!(pct >= 1 && pct <= 100)) { toast('Potongan harus antara 1 dan 100 persen.'); return; }
  if (db.promos.some(x => x.code === code && x.id !== id)) { toast(`Kode ${code} sudah ada.`); return; }
  const data = {code, pct, min:Math.max(0, +f.get('min') || 0), until:String(f.get('until') || ''), active:f.has('active')};
  if (id) Object.assign(db.promos.find(x => x.id === id), data); else db.promos.unshift({id:'k' + uid(), ...data});
  save(); closeDialog(); renderAdmin(); toast(id ? 'Kode promo disimpan.' : `Kode ${code} dibuat.`);
}
function togglePromo(id, v){ const p = db.promos.find(x => x.id === id); if (!p) return; p.active = v; save(); renderAdmin(); toast(v ? `${p.code} aktif.` : `${p.code} dimatikan.`); }
async function deletePromo(id){
  const p = db.promos.find(x => x.id === id); if (!p) return;
  if (!await ask(`Hapus kode ${p.code}?`, 'Pembeli tidak bisa memakai kode ini lagi. Pesanan lama tidak berubah.')) return;
  db.promos = db.promos.filter(x => x.id !== id); save(); renderAdmin(); toast('Kode promo dihapus.');
}

let pullRvBusy = false, pullRvAt = 0;

async function pullRatings(manual){
  const n = db.share.netlify; if (!n.token || !n.siteId || pullRvBusy) return;
  if (!manual && Date.now() - pullRvAt < 60000) return;
  pullRvBusy = true; pullRvAt = Date.now();
  const btn = $('#pullRvBtn'); if (btn) { btn.disabled = true; btn.lastChild.textContent = ' Mengambil…'; }
  try {
    const subs = await nfReq(`/sites/${n.siteId}/submissions?per_page=100`);
    let added = 0;
    (Array.isArray(subs) ? subs : []).forEach(sub => {
      if (!sub || sub.form_name !== 'penilaian') return;
      if (root.ratings.some(r => r.subId === sub.id)) return;
      const d = sub.data || {}, stars = Math.min(5, Math.max(1, parseInt(d.bintang, 10) || 0));
      if (!d.bintang || !stars) return;
      root.ratings.unshift({id:'r' + uid(), subId:sub.id, online:true, isNew:true, name:String(d.nama || 'Pembeli').slice(0, 40), stars, text:String(d.komentar || '').slice(0, 400), product:'', date:String(sub.created_at || new Date().toISOString()).slice(0, 10), show:false});
      added++;
    });
    if (added) { root.ratings.sort((a, b) => String(b.date || '').localeCompare(String(a.date || ''))); save(); }
    if (admin.tab === 'penilaian' || admin.tab === 'ringkasan') renderAdmin();
    else if (added) renderAdmin();
    if (manual || added) toast(added ? `${added} penilaian baru dari pembeli.` : 'Belum ada penilaian baru.');
  } catch (e) {
    if (manual) toast(e.status === 401 ? 'Kode akses Netlify kedaluwarsa. Hubungkan ulang di menu Link pembeli.' : 'Gagal mengambil penilaian. Cek internetmu lalu coba lagi.');
  } finally { pullRvBusy = false; const b2 = $('#pullRvBtn'); if (b2) { b2.disabled = false; b2.lastChild.textContent = ' Ambil penilaian online'; } }
}

async function addFont(inp){
  const file = inp.files[0]; inp.value = ''; if (!file) return;
  const ext = (file.name.match(/\.(ttf|otf|woff2?)$/i) || [])[1];
  if (!ext) { toast('Pilih file font .ttf, .otf, .woff, atau .woff2.'); return; }
  if (file.size > 1.5 * 1048576) { toast(`Font terlalu besar (${mb(file.size)}). Maksimal 1,5 MB. Coba cari versi .woff2-nya.`); return; }
  if (root.look.customFonts.length >= 8) { toast('Maksimal 8 font sendiri. Hapus salah satu dulu.'); return; }
  let data;
  try { data = (await readRaw(file)).replace(/^data:[^;,]*/, 'data:' + FONT_MIME[ext.toLowerCase()]); } catch (e) { toast('File font gagal dibaca.'); return; }
  if (canStore && JSON.stringify(root).length + data.length > 4.6e6) { toast('Penyimpanan browser tidak cukup untuk font ini. Pakai file yang lebih kecil atau hapus beberapa foto.'); return; }
  if (window.FontFace) {
    try { const ff = new FontFace('KZF cek', `url(${data})`); await ff.load(); }
    catch (e) { toast('File itu tidak bisa dipakai sebagai font. Coba file font yang lain.'); return; }
  }
  const name = file.name.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 40) || 'Font sendiri';
  root.look.customFonts.push({id:'f' + uid(), name, ext:ext.toLowerCase(), size:file.size, data});
  if (!save()) { root.look.customFonts.pop(); return; }
  afterFontChange(); toast(`Font ${name} ditambahkan. Pilih di Huruf isi atau Huruf judul.`);
}
async function delFont(id){
  const f = root.look.customFonts.find(x => x.id === id); if (!f) return;
  if (!await ask(`Hapus font “${f.name}”?`, 'Bagian yang memakai font ini kembali ke huruf bawaan.')) return;
  const k = 'cf_' + id;
  root.look.customFonts = root.look.customFonts.filter(x => x.id !== id);
  if (root.look.font === k) root.look.font = 'jakarta';
  if (root.look.fontHead === k) root.look.fontHead = '';
  save(); afterFontChange(); toast('Font dihapus.');
}

function backup(){
  const slug = (db.profile.name || 'toko').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const data = JSON.parse(JSON.stringify(root)); if (data.share && data.share.netlify) data.share.netlify.token = '';
  if (data.share) ['vercel','github','gitlab','neocities'].forEach(k => { if (data.share[k]) data.share[k].token = ''; });
  download(`cadangan-${slug}-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(data, null, 2), 'application/json');
  toast('Cadangan diunduh.');
}
function restore(inp){
  const file = inp.files[0]; inp.value = ''; if (!file) return;
  const r = new FileReader();
  r.onload = async () => {
    let data;
    try { data = JSON.parse(r.result); if (!data || typeof data !== 'object' || !Array.isArray(data.products)) throw 0; }
    catch (err) { toast('File itu bukan cadangan yang valid.'); return; }
    if (data.kind === 'sub') { toast('Ini cadangan dari file toko lain, bukan cadangan toko ini.'); return; }
    if (!await ask('Pulihkan dari cadangan?', 'Semua data sekarang akan diganti dengan isi file cadangan.', 'Pulihkan', false)) return;
    if (data.settings && !data.profile) { const d = DEFAULT_DATA(); migrateV1(data, d); data = d; }   // cadangan versi lama
    const keepTok = root.share.netlify.token, keepUser = root.share.netlify.user, keepAlt = {vercel:root.share.vercel.token, github:root.share.github.token, gitlab:root.share.gitlab.token, neocities:root.share.neocities.token};
    setRoot(normalize(data)); if (!root.share.netlify.token && keepTok) { root.share.netlify.token = keepTok; root.share.netlify.user = keepUser; }
    ['vercel','github','gitlab','neocities'].forEach(k => { if (!root.share[k].token && keepAlt[k]) root.share[k].token = keepAlt[k]; });
    save(); cart = {}; saveCart(); admin.tab = 'ringkasan'; renderAdmin(); toast('Data berhasil dipulihkan.');
  };
  r.readAsText(file);
}

async function wmImage(src){
  if (!db.look.wm || !wmText() || !/^data:image\//.test(src || '')) return src;
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
    const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
    const g = c.getContext('2d'), w = c.width, h = c.height, t = wmText(), op = WM_LEVELS[db.look.wmLevel] || .55;
    const fam = getComputedStyle(document.body).fontFamily;
    let fs = Math.max(14, Math.round(Math.min(w, h) * .12));
    g.drawImage(img, 0, 0); g.translate(w / 2, h / 2); g.rotate(-18 * Math.PI / 180);
    g.font = `800 ${fs}px ${fam}`;
    while (g.measureText(t).width > w * .85 && fs > 10) { fs -= 2; g.font = `800 ${fs}px ${fam}`; }
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineWidth = Math.max(2, fs / 14); g.strokeStyle = `rgba(0,0,0,${op * .4})`; g.strokeText(t, 0, 0);
    g.fillStyle = `rgba(255,255,255,${op})`; g.fillText(t, 0, 0);
    return c.toDataURL('image/jpeg', .86);
  } catch (e) { return src; }
}
async function buyerDataBaked(){
  const d = buyerData();

  return d;
}

async function nfReq(path, opt = {}, token){

async function sha1Hex(bytes){

    for (let t = 0; t < 80; t++) x[t] = t < 16 ? w[i + t] : rot(x[t - 3] ^ x[t - 8] ^ x[t - 14] ^ x[t - 16], 1);
    let [A, B, C, D, E] = [a, b, c, d, e];
    for (let t = 0; t < 80; t++) {
      const f = t < 20 ? (B & C) | (~B & D) : t < 40 ? B ^ C ^ D : t < 60 ? (B & C) | (B & D) | (C & D) : B ^ C ^ D;
      const k = t < 20 ? 0x5A827999 : t < 40 ? 0x6ED9EBA1 : t < 60 ? 0x8F1BBCDC : 0xCA62C1D6;

  else if (!e.status) m = 'Tidak bisa terhubung ke Netlify. Cek internetmu dulu. Kalau internet lancar tapi tetap gagal, berarti Netlify tidak mengizinkan akses dari file ini, jadi pakai cara manual di bawah.';

/* ---------- Domain sendiri ---------- */
const cleanDomain = v => String(v || '').trim().toLowerCase().replace(/^https?:\/\//, '').replace(/\/.*$/, '').replace(/^www\./, '');

async function nfSetDomain(){

  if (/\.netlify\.app$/.test(d)) { toast('Itu alamat Netlify, bukan domain sendiri. Ganti nama link lewat situs Netlify.'); return; }

async function nfDisconnect(){

async function nfPublish(){

      try { await nfReq(`/sites/${n.siteId}`); }

        if (e.status === 401) throw e;
        if (e.status === 403 || e.status === 404) { nfSaving = true; Object.assign(n, {siteId:'', url:'', name:'', domain:'', at:''}); save(); nfSaving = false; toast('Situs lama tidak bisa diakses dengan key ini. Dibuat situs baru.'); }

    if (!n.siteId) {

    }

      if (live && (live !== n.url || (info.custom_domain || '') !== (n.domain || ''))) { nfSaving = true; Object.assign(n, {url:live, name:info.name || n.name, domain:info.custom_domain || ''}); db.share.url = live; save(); nfSaving = false; }

      await nfReq(`/deploys/${dep.id}/files/index.html`, {method:'PUT', headers:{'Content-Type':'application/octet-stream'}, body:bytes});
    }
    nfStatus('Menunggu Netlify menyelesaikan…');
    for (let i = 0; i < 40; i++) {
      const d = await nfReq(`/deploys/${dep.id}`);
      if (d.state === 'ready') break;
      if (d.state === 'error') { const e = new Error(d.error_message || 'deploy gagal'); e.status = 500; throw e; }
      await new Promise(r => setTimeout(r, 1500));
    }

    renderAdmin(); toast('Toko sudah terbit. Link siap dibagikan.');
  } catch (e) { nfSaving = false; renderAdmin(); nfFail(e); }

async function keyConnect(){
  const t = (($('#keyIn') || {}).value || '').trim();
  if (!t) { toast('Tempel API key dulu.'); return; }
  const order = /^nf[a-z]_/.test(t) ? ['netlify'] : /^(gh[pousr]_|github_pat_)/.test(t) ? ['github'] : /^glpat-/.test(t) ? ['gitlab'] : /^[0-9a-f]{32}$/i.test(t) ? ['neocities', 'vercel', 'netlify'] : ['vercel', 'netlify', 'github', 'gitlab', 'neocities'];
  nfStatus('Mengecek API key…');
  const fails = [];
  for (const h of order) {
    try {
      let user;
      if (h === 'netlify') { const u = await nfReq('/user', {}, t); user = u.full_name || u.email || u.slug || ''; }
      else if (h === 'vercel') { const u = (await altReq(h, '/v2/user', {}, t)).user; user = u.username || u.name || u.email || ''; }
      else if (h === 'gitlab') { const u = await altReq(h, '/api/v4/user', {}, t); user = u.username; }
      else if (h === 'neocities') { const u = await altReq(h, '/api/info', {}, t); user = u.info.sitename; }
      else { const u = await altReq(h, '/user', {}, t); user = u.login; }
      nfSaving = true; db.share.provider = h; Object.assign(db.share[h], {token:t, user}); save(); nfSaving = false;
      renderAdmin(); toast('Terhubung ke ' + HOSTS[h].label + '.'); return;
    } catch (e) { fails.push(HOSTS[h].label + (e.status ? ' ' + e.status : ' tidak terjangkau')); }
  }
  const m = fails.every(x => /tidak terjangkau/.test(x)) ? 'Tidak bisa terhubung ke platform mana pun. Cek internetmu, lalu coba lagi. (' + fails.join(', ') + ')'
    : 'API key tidak cocok dengan platform yang didukung (Netlify, Vercel, GitHub, GitLab, Neocities). Hasil: ' + fails.join(', ') + '.';
  nfStatus(m, 'err'); toast(m.split('. ')[0] + '.');
}

/* ============================================================
   MENU PILIHAN (pengganti dropdown bawaan HP)
   Setiap <select> otomatis diganti tombol + menu bergaya toko.
   <select> aslinya tetap ada (disembunyikan) untuk menyimpan nilai.
   ============================================================ */
let csOpen = null;
function csTitle(sel){
  const lab = sel.closest('label.field'), sp = lab && lab.querySelector(':scope > span');
  return (sp && sp.childNodes[0] ? sp.childNodes[0].textContent.trim() : '') || sel.getAttribute('aria-label') || 'Pilih';
}
function enhanceSelect(sel){
  if (sel.dataset.cs) return; sel.dataset.cs = '1';
  const wrap = document.createElement('span'), btn = document.createElement('button');
  const isStatus = sel.classList.contains('status'), al = sel.getAttribute('aria-label');
  wrap.className = 'csel' + (isStatus ? ' csel-status' : '');
  btn.type = 'button'; btn.setAttribute('aria-haspopup', 'listbox'); btn.setAttribute('aria-expanded', 'false');
  sel.parentNode.insertBefore(wrap, sel); wrap.append(btn, sel);
  sel.classList.add('csel-native'); sel.tabIndex = -1;
  const sync = () => {
    const o = sel.options[sel.selectedIndex], t = o ? o.text : '';
    btn.className = 'csel-btn' + (isStatus ? ' ' + sel.className.replace('csel-native', '').trim() : '');
    btn.innerHTML = `<span class="csel-txt">${esc(t)}</span>${ic('down', 'csel-ic')}`;
    if (al) btn.setAttribute('aria-label', `${al}: ${t}`);
  };
  sync(); sel.addEventListener('change', sync);
  btn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); if (csOpen && csOpen.sel === sel) csClose(); else csShow(sel, btn); });
}
function csShow(sel, btn){
  csClose();
  const mobile = !!window.matchMedia && matchMedia('(max-width:760px)').matches, isStatus = sel.classList.contains('status'), title = csTitle(sel);
  const ov = document.createElement('div');
  ov.className = 'cs-layer' + (mobile ? ' cs-sheet' : '');
  ov.innerHTML = `<div class="cs-menu">
    ${mobile ? `<div class="cs-head"><b>${esc(title)}</b><button type="button" class="btn btn-quiet btn-icon btn-sm" data-cs-close aria-label="Tutup">${ic('x')}</button></div>` : ''}
    <div class="cs-list" role="listbox" aria-label="${esc(title)}">${[...sel.options].map((o, i) => `<button type="button" class="cs-opt" role="option" data-i="${i}" aria-selected="${i === sel.selectedIndex}">${isStatus ? `<i class="cs-dot st-${esc(o.value)}"></i>` : ''}<span>${esc(o.text)}</span>${i === sel.selectedIndex ? ic('check', 'cs-check') : ''}</button>`).join('')}</div></div>`;
  document.body.appendChild(ov);
  const menu = ov.firstElementChild, list = menu.querySelector('.cs-list');
  if (!mobile) {                                   // menu kecil tepat di bawah (atau di atas) tombol
    const r = btn.getBoundingClientRect(), w = Math.min(Math.max(r.width, 200), innerWidth - 16);
    const below = innerHeight - r.bottom - 14, above = r.top - 14, need = Math.min(menu.offsetHeight, 320);
    menu.style.width = w + 'px'; menu.style.left = Math.min(Math.max(8, r.left), innerWidth - w - 8) + 'px';
    if (below < need && above > below) { menu.style.bottom = (innerHeight - r.top + 6) + 'px'; list.style.maxHeight = Math.min(320, above) + 'px'; menu.classList.add('up'); }
    else { menu.style.top = (r.bottom + 6) + 'px'; list.style.maxHeight = Math.min(320, below) + 'px'; }
  }
  const locked = document.body.classList.contains('locked');
  if (mobile) document.body.classList.add('locked');
  btn.setAttribute('aria-expanded', 'true');
  const key = e => {
    const opts = [...list.querySelectorAll('.cs-opt')], i = opts.indexOf(document.activeElement);
    if (e.key === 'Escape' || e.key === 'Tab') { e.preventDefault(); e.stopPropagation(); csClose(true); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); opts[(i + (e.key === 'ArrowDown' ? 1 : -1) + opts.length) % opts.length].focus(); }
  };
  document.addEventListener('keydown', key, true);
  const away = () => csClose();
  addEventListener('resize', away); 
  ov.addEventListener('wheel', e => { if (!list.contains(e.target)) csClose(); }, {passive:true});
  ov.addEventListener('click', e => {
    const o = e.target.closest('.cs-opt');
    if (o) {
      const i = +o.dataset.i, changed = i !== sel.selectedIndex;
      csClose(true);
      if (changed) { sel.selectedIndex = i; sel.dispatchEvent(new Event('input', {bubbles:true})); sel.dispatchEvent(new Event('change', {bubbles:true})); }
    } else if (e.target === ov || e.target.closest('[data-cs-close]')) csClose(true);
  });
  csOpen = {sel, btn, ov, key, away, locked};
  const cur = list.querySelector('[aria-selected="true"]') || list.querySelector('.cs-opt');
  if (cur) { cur.focus({preventScroll:true}); cur.scrollIntoView({block:'nearest'}); }
}
function csClose(refocus){
  if (!csOpen) return;
  const {btn, ov, key, away, locked} = csOpen; csOpen = null;
  ov.remove(); document.removeEventListener('keydown', key, true); removeEventListener('resize', away);
  if (!locked) document.body.classList.remove('locked');
  btn.setAttribute('aria-expanded', 'false');
  if (refocus && btn.isConnected) btn.focus({preventScroll:true});
}
new MutationObserver(() => document.querySelectorAll('select:not([data-cs])').forEach(enhanceSelect)).observe(document.body, {childList:true, subtree:true});

function showSplash(force){
  if (!force && db.look.splash === false) return;
  const old = $('#splash'); if (old) old.remove();
  const P = db.profile, el = document.createElement('div');
  el.id = 'splash'; el.className = 'splash'; el.setAttribute('role', 'presentation');
  el.innerHTML = `<div class="splash-in">
      <div class="splash-av">${visOk(P.logo) ? visual(P.logo, '') : `<span>${esc(initials(P.name))}</span>`}</div>
      <div class="splash-name">${esc(P.name)}</div>
      <div class="splash-bar"><i></i></div>
    </div>`;
  document.body.appendChild(el); document.body.classList.add('splashing'); playVids(el);
  const calm = db.look.anim === 'mati' || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const close = () => {
    if (!el.isConnected || el.classList.contains('out')) return;
    el.classList.add('out'); document.body.classList.remove('splashing');
    setTimeout(() => el.remove(), calm ? 10 : 500);
  };
  el.addEventListener('click', close);
  setTimeout(close, calm ? 700 : (db.look.anim === 'meriah' ? 1900 : 1500));
}
